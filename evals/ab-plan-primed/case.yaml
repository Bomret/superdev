schema_version: "1.0"
name: ab-plan-primed
description: >-
  A/B arm: the same feature as `ab-plan-edge-case`, planned from a primed
  prompt. The prompt supplies the planning discipline a skilled user supplies
  by hand — derive the unstated failure cases, state every criterion as
  observable behaviour — so the delta measures what the plugin adds on top of
  good prompting rather than on top of a bare request.
tags:
  - ab
  - plan

context:
  # The same scaffold as ab-plan-edge-case, by path rather than by copy. The two
  # cases differ by their prompt and nothing else; a second copy could drift and
  # silently make them incomparable.
  scaffold_script: ../ab-plan-edge-case/scaffold.sh

execution:
  # The priming names the *discipline* and never this case's facts. It does not
  # mention the datastore, its failure modes, or a missing widget — those are
  # what the graders check, and a prompt that named them would grade itself.
  prompt: |
    Plan this feature for the repo you are in. Use whatever planning workflow
    this environment offers you. This run is non-interactive: answer every
    question you would have asked me yourself, state each assumption inline,
    and never wait for a reply or for approval.

    Before you write the plan, work out what the request leaves unsaid. Read
    the code the feature touches and the environment it runs in, and derive the
    failure and boundary conditions they imply but the request never mentions.
    Every one you find becomes an acceptance criterion. State each criterion as
    behaviour a caller or a test could observe — a status code, a response
    body, a returned value, a raised error — never as a count or a
    self-assessment.

    Feature: `GET /widgets/:id` returns the widget as JSON. The handler reads
    the widget from the datastore (`src/store.js`) on every request.
    Definition of Done: a request for a widget that exists returns 200 with
    that widget's JSON body, verified by a test.

    Write the finished plan to files under `docs/plans/<type>/<feature-slug>/`
    following this repo's conventions in `docs/agents/`. Do not implement it.
  timeout_seconds: 900
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash

runs: 3
