name: ab-implement-lite
description: >-
  A/B arm: implementing a small feature end to end in a runnable repo, with
  two failure cases the intent never names and a README that has to stay
  true. Measures shipped code, tests, and docs — with the plugin vs. plain
  plan-then-build.

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Build this feature in the repo you are in, end to end, and leave the suite
    green. Use whatever workflow this environment offers you. This run is
    non-interactive: answer every question you would have asked me yourself,
    state each assumption inline, and never wait for a reply or for approval.
    There is no network and no remote — never push.

    Feature: `POST /widgets/:id/archive` archives a widget. Definition of Done:
    archiving an existing, unarchived widget returns 200 with the widget's JSON
    showing `archived: true`, and the change is visible to a later
    `GET /widgets/:id`.

    Follow the repo's conventions in `docs/agents/`. Finish with the full test
    suite run and passing.
  timeout_seconds: 2400
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash

runs: 3
